<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula 6 — Equilíbrio Químico (Unidade 1)</title>
<style>
  :root{
    --chalk:#f5f2e8; --yellow:#ffe97a; --pink:#e8a0d8; --cyan:#7fd4e8;
    --green:#a5d6a7; --orange:#ffb74d; --ink:#16201b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    background:linear-gradient(160deg,#2f6e4f 0%,#265c43 55%,#1f5540 100%);
    color:var(--chalk);
    font-family:"DejaVu Sans","Verdana","Segoe UI",system-ui,sans-serif;
    padding:28px 20px 60px; line-height:1.5;
  }
  .wrap{max-width:940px;margin:0 auto}
  header{margin-bottom:22px}
  .disc{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:#b7e9f5}
  h1{font-size:1.5rem;margin:.25rem 0 .5rem;text-shadow:0 2px 0 rgba(22,32,27,.55)}
  .meta{font-size:.9rem;color:rgba(245,242,232,.92)}
  .bar{height:8px;border-radius:6px;background:rgba(22,32,27,.45);margin-top:16px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--cyan);transition:width .35s ease}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;
       font-size:.86rem;color:rgba(245,242,232,.92);flex-wrap:wrap}
  .toggle{cursor:pointer;border:2px solid rgba(245,242,232,.5);background:transparent;color:var(--chalk);
          border-radius:999px;padding:6px 14px;font:inherit;font-size:.82rem}
  .toggle[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow);font-weight:700}
  .card{background:rgba(22,32,27,.30);border:2px solid rgba(245,242,232,.22);border-radius:16px;
        padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .qnum{font-size:.82rem;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  .stem{font-size:1.18rem;font-weight:700;margin-bottom:20px}
  .opts{display:grid;gap:11px}
  button.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
    background:rgba(245,242,232,.06);border:2px solid rgba(245,242,232,.28);color:var(--chalk);
    border-radius:12px;padding:14px 16px;font:inherit;font-size:1rem;cursor:pointer;transition:.15s}
  button.opt:hover:not(:disabled){background:rgba(245,242,232,.14);border-color:var(--chalk)}
  button.opt:disabled{cursor:default}
  button.opt .k{font-weight:700;color:#b7e9f5;min-width:1.2em}
  button.opt.ok{background:rgba(165,214,167,.22);border-color:var(--green)}
  button.opt.ok .k{color:#c8e6c9}
  button.opt.bad{background:rgba(232,160,216,.18);border-color:var(--pink)}
  button.opt.bad .k{color:#f2c8e8}
  button.opt.dim{opacity:.45}
  .fb{margin-top:18px;border-left:5px solid var(--cyan);border-radius:8px;padding:14px 16px;
      background:rgba(22,32,27,.42);font-size:.97rem}
  .fb.good{border-left-color:var(--green)}
  .fb.bad{border-left-color:var(--pink)}
  .fb b{color:var(--yellow)}
  .fb.good b{color:var(--green)}
  .fb.bad b{color:var(--pink)}
  .nav{margin-top:20px;display:flex;justify-content:flex-end;gap:12px}
  .go{background:var(--cyan);color:var(--ink);border:0;border-radius:10px;padding:12px 26px;
      font:inherit;font-weight:700;cursor:pointer}
  .go:disabled{opacity:.4;cursor:not-allowed}
  /* (C1) foco de teclado visivel: o anel padrao do navegador (#101010) some no
     fundo escuro (medido 1,07:1). Aqui o anel e ciano, ~9:1 sobre o fundo. */
  a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,
  textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
  .count{font-variant-numeric:tabular-nums;color:var(--yellow);font-weight:700}
  .done{text-align:center}
  .score{font-size:3.2rem;font-weight:700;color:var(--cyan);text-shadow:0 3px 0 rgba(22,32,27,.5)}
  .score small{font-size:1.2rem;color:rgba(245,242,232,.7)}
  .verdict{margin:10px 0 22px;font-size:1.1rem;color:var(--yellow)}
  .rev{text-align:left;background:rgba(22,32,27,.3);border:2px solid rgba(245,242,232,.18);
       border-radius:14px;padding:18px;margin-top:8px}
  .rev h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan);margin-bottom:12px}
  .rev li{list-style:none;padding:10px 0;border-bottom:1px solid rgba(245,242,232,.12);font-size:.94rem}
  .rev li:last-child{border-bottom:0}
  .rev .tag{font-weight:700}
  .rev .tag.ok{color:var(--green)}
  .rev .tag.no{color:var(--pink)}
  .hint{font-size:.82rem;color:rgba(245,242,232,.9);margin-top:14px;text-align:center}
  /* (A3) impressao — fundo escuro vira branco com "graficos de plano de fundo" off. */
  @media print{
    @page{margin:14mm}
    html,body{background:#fff!important;color:#111!important;padding:0}
    .bar,.row,.hint,.toggle,.nav{display:none!important}
    h1,.disc,.meta,.stem,.qnum,.verdict,.score{color:#111!important;text-shadow:none}
    .card{background:#fff!important;border:1px solid #bbb;box-shadow:none}
    button.opt{background:#fff!important;border:1px solid #666!important;color:#111!important;break-inside:avoid}
    button.opt .k{color:#111!important}
    .fb{background:#fff!important;border-left:5px solid #666!important;color:#111!important}
  }
</style></head><body>
<div class="wrap">
  <header>
    <div class="disc">Físico-Química II</div>
    <h1>Aula 6 — Equilíbrio Químico (Unidade 1)</h1>
    <div class="meta">Princípio 12 (erro deliberado): cada questão tem um distrator que representa o erro típico do aluno, com feedback explicando por que está errado.</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="row">
      <span>Questão <b id="qi">1</b> de <b id="qn">0</b> · acertos: <b id="hits">0</b></span>
      <button class="toggle" id="ta" aria-pressed="false">Modo aula (25s p/ revelar)</button>
    </div>
  </header>
  <main id="main"></main>
  <div class="hint">Atalhos: 1–4 respondem · Enter avança · R reinicia</div>
</div>
<script>
function q_verdict_low(){ return (QUIZ.verdict_low || "Vale rever os slides da energia interna e da 1ª Lei (6–9) e os de termoquímica e entropia (12–18) antes da próxima aula."); }
const QUIZ = {"schema": "maic-like/quiz@1", "discipline": "Físico-Química II", "lesson": "Aula 6 — Equilíbrio Químico (Unidade 1)", "language": "pt-BR", "principle": "Princípio 12 (erro deliberado): cada questão tem um distrator que representa o erro típico do aluno, com feedback explicando por que está errado.", "data_note": "Constantes e valores de referência: R = 8,314462618 J K⁻¹ mol⁻¹ (CODATA); ΔfG°(N₂O₄,g)=97,89 kJ mol⁻¹ e ΔfG°(NO₂,g)=51,31 kJ mol⁻¹ → ΔrG°=+4,73 kJ mol⁻¹, K°=0,148 a 298,15 K; ΔrH°(N₂+3H₂⇌2NH₃)=−92,2 kJ mol⁻¹.", "questions": [{"id": "q1", "scene": "cena_03", "stem": "A 298 K e 1 bar, para N₂O₄(g) ⇌ 2 NO₂(g) tem-se ΔrG° = +4,73 kJ mol⁻¹. Enquanto a mistura caminha para o equilíbrio, o que determina a direção espontânea?", "options": [{"key": "A", "text": "O sinal de ΔrG° sozinho: como é positivo, a reação é proibida e nada acontece", "correct": false, "feedback": "ΔrG° > 0 não proíbe nada — só diz que, partindo de reagentes puros (Q pequeno), o sentido direto não é o espontâneo no padrão. Basta Q sair do padrão (aqui Q < K°=0,148) para a direção direta virar espontânea."}, {"key": "B", "text": "A velocidade da reação: só avança o sentido cujas colisões forem mais frequentes", "correct": false, "feedback": "Cinética responde 'quão rápido', termodinâmica responde 'para onde'. A direção espontânea é ditada por ΔrG (mínimo de G), independentemente da velocidade — que pode até ser zero na prática (barreira de ativação)."}, {"key": "C", "text": "A reação direta é espontânea até consumir todo o N₂O₄, pois reações espontâneas vão até completar", "correct": false, "feedback": "ARMADILHA DA AULA: a reação para no MÍNIMO de G, não em conversão total. No equilíbrio coexistem N₂O₄ e NO₂ — a curva de G não desce indefinidamente por causa do termo de mistura RT Σn_i ln x_i."}, {"key": "D", "text": "O sinal de ΔrG = ΔrG° + RT ln Q: a T e p constantes a reação segue o sentido que diminui G, parando quando ΔrG = 0", "correct": true, "feedback": "Correto. ΔrG° é o valor só na composição padrão; na mistura real quem manda é ΔrG = ΔrG° + RT ln Q. O sistema desce a curva de G até o mínimo, onde a inclinação (∂G/∂ξ) = ΔrG = 0 — esse mínimo É o equilíbrio."}]}, {"id": "q2", "scene": "cena_06", "stem": "Sobre a curva de G (energia de Gibbs) em função da extensão ξ (avanço) da reação, a T e p constantes, qual afirmação é correta?", "options": [{"key": "A", "text": "ΔrG = (∂G/∂ξ)_T,p é o coeficiente angular dessa curva; no mínimo dela ΔrG = 0 e o sistema está em equilíbrio", "correct": true, "feedback": "Correto. É a definição de afinidade: a inclinação de G contra ξ é ΔrG. Inclinação negativa → avança para a direita; positiva → para a esquerda; zero → equilíbrio."}, {"key": "B", "text": "O mínimo ocorre sempre em ξ = metade do máximo, qualquer que seja K", "correct": false, "feedback": "A posição do mínimo É K. Se K ≫ 1 o mínimo fica perto dos produtos; se K ≪ 1, perto dos reagentes. Só para K = 1 (caso especial) ele cairia no meio."}, {"key": "C", "text": "A curva é sempre uma reta de inclinação ΔrG°, pois G é linear em ξ", "correct": false, "feedback": "Sem misturação a curva seria uma reta (ΔrG constante) — mas misturar tem custo entrópico RT Σn_i ln x_i, que encurva a função e cria o mínimo. É justamente a mistura que gera o mínimo (e o equilíbrio)."}, {"key": "D", "text": "No equilíbrio ΔrG = ΔrG°, pois as concentrações deixam de importar", "correct": false, "feedback": "ARMADILHA DA AULA: no equilíbrio ΔrG = 0, e não ΔrG°. O que vale no equilíbrio é Q = K, de modo que ΔrG = ΔrG° + RT ln K = 0. Confundir ΔrG com ΔrG° é o erro mais comum do tópico."}]}, {"id": "q3", "scene": "cena_08", "stem": "Num reator, N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g) apresenta Q = 10, e a 400 K a constante vale K = 60. O que acontece em seguida?", "options": [{"key": "A", "text": "Não é possível comparar Q com K porque eles têm unidades diferentes", "correct": false, "feedback": "Atividades são adimensionais e Q e K herdam essa adimensionalidade (as pressões entram como p/p°). Comparar Q com K é legítimo — o erro de 'unidades' aqui é uma falsa objeção."}, {"key": "B", "text": "Q ≠ K, então a reação não pode estar em equilíbrio e nada mais pode ser dito", "correct": false, "feedback": "Q ≠ K apenas diz que o sistema AINDA NÃO está em equilíbrio — e por isso justamente ele evolui. Toda a informação de direção está no sinal de ΔrG = RT ln(Q/K)."}, {"key": "C", "text": "Como Q < K, a reação avança no sentido direto (forma mais NH₃) até Q alcançar K", "correct": true, "feedback": "Correto. ΔrG = RT ln(Q/K) < 0: direto é espontâneo. O avanço consome reagentes e forma NH₃, o que AUMENTA Q até igualar K. Comparar Q com K é o critério prático de direção."}, {"key": "D", "text": "Como Q < K, a reação avança no sentido inverso, para reduzir Q", "correct": false, "feedback": "ARMADILHA DA AULA: direção trocada. Q < K significa que falta produto em relação ao equilíbrio — o sistema forma MAIS produto, o que aumenta Q até K. (O inverso é que reduziria Q.)"}]}, {"id": "q4", "scene": "cena_20", "stem": "Para N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), ΔrH° = −92,2 kJ mol⁻¹. Se a temperatura sobe (T e p monitoradas), o que ocorre com K e com o rendimento em NH₃?", "options": [{"key": "A", "text": "K aumenta, porque sendo exotérmica o calor 'empurra' o equilíbrio para os produtos", "correct": false, "feedback": "Raciocínio invertido. Exotérmica: aquecer REMOVE o equilíbrio do lado que gera calor. O sentido favorecido por aumento de T é o endotérmico (aqui, o inverso), e K diminui."}, {"key": "B", "text": "K diminui (van't Hoff: d ln K/dT = ΔrH°/(RT²) < 0) e o equilíbrio desloca para os reagentes — o rendimento em NH₃ cai", "correct": true, "feedback": "Correto. Exotérmica → aquecer empurra o sistema no sentido que ABSORVE calor, isto é, o inverso (Le Chatelier). Integrando van't Hoff, ln K cai com T, então a 500 K o rendimento de NH₃ despenca — é por isso que a síntese industrial usa pressão alta, não temperatura alta."}, {"key": "C", "text": "K permanece constante; só a velocidade e a pressão mudam", "correct": false, "feedback": "K depende de T, não de p (p só muda a composição, não K). Afirmar que K não varia com T é o erro de confundir a dependência correta (T) com a errada (p)."}, {"key": "D", "text": "K aumenta, pois mais temperatura acelera a formação de produto", "correct": false, "feedback": "ARMADILHA DA AULA: confundir velocidade com posição de equilíbrio. Aquecer acelera os dois sentidos, mas desloca a POSIÇÃO no sentido endotérmico — aqui, o inverso. A constante K cai."}]}, {"id": "q5", "scene": "cena_17", "stem": "Para N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g) (Δn_gás = −2), o sistema é comprimido (V diminui, p aumenta) a T constante. O que acontece?", "options": [{"key": "A", "text": "K não muda (K só depende de T); como Δn_gás < 0, o aumento de p desloca o equilíbrio para os produtos e o rendimento em NH₃ cresce", "correct": true, "feedback": "Correto. Comprimir aumenta todas as pressões parciais; para recompor Q = K o sistema caminha no sentido que DIMINUI o número de moléculas gasosas — 4 mol → 2 mol, ou seja, para os produtos. K intocada, composição deslocada: essa é a essência de Le Chatelier na compressão."}, {"key": "B", "text": "O equilíbrio desloca para o lado com mais moléculas de gás (reagentes), para aliviar a pressão", "correct": false, "feedback": "Direção invertida. Para aliviar o aumento de pressão o sistema reduz o número de partículas: consome 4 mol de gás e forma 2 mol → vai para os PRODUTOS, não para os reagentes."}, {"key": "C", "text": "Nada muda, pois a compressão não afeta o equilíbrio de um gás", "correct": false, "feedback": "A compressão só não muda a composição quando Δn_gás = 0 (é o caso de H₂+I₂⇌2HI). Aqui Δn_gás = −2 ≠ 0, então a composição muda mesmo com K constante."}, {"key": "D", "text": "A compressão aumenta K, e por isso a formação de NH₃ aumenta", "correct": false, "feedback": "ARMADILHA DA AULA: K NÃO depende da pressão — só de T. Quem muda com a compressão é o quociente Q (as pressões parciais sobem), e o sistema reajusta a composição para voltar a Q = K. Atribuir a mudança de composição a uma mudança de K está errado."}]}, {"id": "q6", "scene": "cena_09", "stem": "A 298,15 K, ΔrG°(N₂O₄(g) → 2 NO₂(g)) = +4,73 kJ mol⁻¹. Usando K = exp(−ΔrG°/RT) com R = 8,314 J K⁻¹ mol⁻¹, qual é o valor de K?", "options": [{"key": "A", "text": "≈ 6,74", "correct": false, "feedback": "ARMADILHA DA AULA: esqueceu o sinal de menos. 6,74 = exp(+4730/RT) vem de usar K = exp(+ΔrG°/RT). O expoente é −ΔrG°/RT, e com ΔrG° > 0 isso dá K < 1."}, {"key": "B", "text": "≈ 0,998", "correct": false, "feedback": "Erro de unidades: você usou ΔrG° = 4,73 (em kJ) direto com R em J. Como R está em J K⁻¹ mol⁻¹, converta ΔrG° para 4730 J mol⁻¹. A checagem dimensional evita o fator 1000 perdido."}, {"key": "C", "text": "≈ 1,00, pois ΔrG° > 0 impede a formação de produto", "correct": false, "feedback": "ΔrG° > 0 dá K < 1, não K = 1. K = 1 só quando ΔrG° = 0. E ΔrG° > 0 não impede a formação de NO₂ — apenas torna os reagentes favorecidos no estado padrão."}, {"key": "D", "text": "≈ 0,148", "correct": true, "feedback": "Correto. −ΔrG°/(RT) = −4730/(8,314×298,15) = −1,908, e e^(−1,908) = 0,148. K < 1 é coerente com ΔrG° > 0: no padrão, reagentes são favorecidos — mas o NO₂ ainda aparece porque o termo RT ln Q compensa."}]}]};
const SECS = 25;
let i = 0, hits = 0, log = [], answered = false, timer = null, left = SECS, classMode = false;

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function startTimer(){
  clearInterval(timer);
  if(!classMode || answered) { return; }
  left = SECS;
  timer = setInterval(() => {
    left--;
    const el = document.getElementById('cd');
    if(el) el.textContent = left;
    if(left <= 0){ clearInterval(timer); revealByTimer(); }
  }, 1000);
}

function revealByTimer(){
  if(answered) return;
  answered = true;
  const q = QUIZ.questions[i];
  q.options.forEach(o => {
    const b = document.querySelector('button.opt[data-k="'+o.key+'"]');
    if(b){ b.disabled = true; if(o.correct) b.classList.add('ok'); else b.classList.add('dim'); }
  });
  const right = q.options.find(o => o.correct);
  log.push({stem: q.stem, picked: null, right: right.key, ok: false});
  showFeedback(null, right);
}

function render(){
  if(i >= QUIZ.questions.length) return finish();
  answered = false;
  const q = QUIZ.questions[i];
  $('#qi').textContent = i + 1;
  $('#hits').textContent = hits;
  $('#bar').style.width = (i / QUIZ.questions.length * 100) + '%';
  $('#main').innerHTML =
    '<div class="card">' +
      '<div class="qnum">Questão ' + (i+1) + '</div>' +
      '<div class="stem">' + esc(q.stem) + '</div>' +
      '<div class="opts">' + q.options.map(o =>
        '<button class="opt" data-k="' + o.key + '"><span class="k">' + o.key +
        '</span><span>' + esc(o.text) + '</span></button>').join('') + '</div>' +
      '<div id="fb" role="status" aria-live="polite"></div>' +
      '<div class="nav"><button class="go" id="next" disabled>Próxima →</button></div>' +
    '</div>';
  document.querySelectorAll('button.opt').forEach(b =>
    b.addEventListener('click', () => answer(b.dataset.k)));
  $('#next').addEventListener('click', () => { i++; render(); });
  if(classMode){
    const f = document.createElement('div');
    f.className = 'hint';
    f.innerHTML = 'Revelando em <span class="count" id="cd">' + SECS + '</span>s';
    $('#main').querySelector('.card').appendChild(f);
    startTimer();
  }
}

function answer(k){
  if(answered) return;
  answered = true; clearInterval(timer);
  const q = QUIZ.questions[i];
  const picked = q.options.find(o => o.key === k);
  const right = q.options.find(o => o.correct);
  q.options.forEach(o => {
    const b = document.querySelector('button.opt[data-k="'+o.key+'"]');
    b.disabled = true;
    if(o.correct) b.classList.add('ok');
    else if(o.key === k) b.classList.add('bad');
    else b.classList.add('dim');
  });
  if(picked.correct) hits++;
  log.push({stem: q.stem, picked: k, right: right.key, ok: picked.correct});
  $('#hits').textContent = hits;
  showFeedback(picked, right);
  $('#next').disabled = false;
  $('#next').focus();
}

function showFeedback(picked, right){
  const cls = picked ? (picked.correct ? 'good' : 'bad') : 'bad';
  const head = picked
    ? (picked.correct ? 'Correto — alternativa ' + picked.key : 'Errado — você marcou ' + picked.key + '; a correta é ' + right.key)
    : 'Tempo esgotado — a correta é ' + right.key;
  const body = picked ? picked.feedback : right.feedback;
  const fb = $('#fb');
  fb.innerHTML = '<div class="fb ' + cls + '"><b>' + head + '.</b> ' + esc(body) + '</div>';
  const n = $('#next'); if(n) n.disabled = false;
}

function finish(){
  clearInterval(timer);
  $('#bar').style.width = '100%';
  const pct = Math.round(hits / QUIZ.questions.length * 100);
  const verdict = pct === 100 ? 'Domínio completo do conceito.'
    : pct >= 67 ? 'Bom — revise as questões erradas antes da prática.'
    : q_verdict_low();
  $('#main').innerHTML =
    '<div class="card done">' +
      '<div class="score">' + hits + '<small>/' + QUIZ.questions.length + '</small></div>' +
      '<div class="verdict" role="status">' + verdict + '</div>' +
      '<div class="rev"><h3>Revisão</h3><ul>' +
        log.map((l, n) => '<li><span class="tag ' + (l.ok ? 'ok' : 'no') + '">' +
          (l.ok ? '✔' : '✘') + '</span> <b>Q' + (n+1) + '.</b> ' + esc(l.stem) +
          (l.ok ? '' : ' <em>(marcou ' + l.picked + '; correta: ' + l.right + ')</em>') + '</li>').join('') +
      '</ul></div>' +
      '<div class="nav" style="justify-content:center"><button class="go" id="again">Refazer</button></div>' +
    '</div>';
  $('#again').addEventListener('click', () => { i = 0; hits = 0; log = []; render(); });
}

$('#ta').addEventListener('click', e => {
  classMode = !classMode;
  e.target.setAttribute('aria-pressed', String(classMode));
  render();
});
$('#qn').textContent = QUIZ.questions.length;
document.addEventListener('keydown', e => {
  if(e.key >= '1' && e.key <= '4'){
    const k = ['A','B','C','D'][Number(e.key) - 1];
    if(!answered && document.querySelector('button.opt[data-k="'+k+'"]')) answer(k);
  }
  if(e.key === 'Enter'){ const n = document.getElementById('next'); if(n && !n.disabled) n.click(); }
  if(e.key.toLowerCase() === 'r'){ i = 0; hits = 0; log = []; render(); }
